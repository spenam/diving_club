name: Deploy to club host (optional self-hosted runner)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    # Install and secure a dedicated self-hosted runner on the club Linux host
    # before enabling this job. Do not run untrusted PR workflows on that runner.
    runs-on: [self-hosted, linux, club-deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Deploy approved checkout
        run: |
          docker compose pull || true
          docker compose up -d --build
          docker compose exec -T backend alembic upgrade head
          curl --fail http://localhost:8080/health
